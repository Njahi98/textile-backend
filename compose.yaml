services:
  backend:
    build: .
    image: textile-backend:dev
    container_name: textile_backend_c_v1
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated
    env_file:
      - .env
    environment:
      DOCKER_ENV: 'true'
      POSTGRES_HOST: textile_app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - textile-network

  db:
    image: postgres:18-trixie
    container_name: textile-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-textile} -d ${POSTGRES_DB:-textile}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - textile-network

volumes:
  postgres_data:
    name: textile-postgres-data
    driver: local

networks:
  textile-network:
    external: true